<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>400 - Bad Request</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'lime-light': '#f7fee7',
              'lime-bright': '#84cc16'
            },
            fontFamily: {
              montserrat: ['Montserrat', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style>
      .bg-gradient-circle {
        background: radial-gradient(circle at 10% 10%, rgba(132, 204, 22, 0.15), transparent 50%);
      }
    </style>
  </head>
  <body class="bg-lime-light min-h-screen flex flex-col font-montserrat antialiased overflow-x-hidden bg-gradient-circle">
    <main class="flex-1 flex flex-col items-center justify-center p-6 text-center">
      <div class="flex flex-col items-center justify-center leading-none">
        <h1 class="font-black text-black flex items-center justify-center text-[6rem] sm:text-[10rem] md:text-[14rem] lg:text-[18rem]">4<span class="text-lime-bright">00</span></h1>
        <h2 class="font-black uppercase text-center text-xl sm:text-3xl md:text-5xl lg:text-6xl -mt-4 sm:-mt-6 md:-mt-10">BAD REQUEST</h2>
        <p class="mt-6 text-sm md:text-base font-bold text-gray-500 uppercase tracking-widest max-w-lg">The request could not be understood. Please try again.</p>
      </div>
      <a href="{% url 'core:home' %}" class="mt-10 bg-lime-bright text-black font-black uppercase px-8 md:px-16 py-4 md:py-6 rounded shadow-2xl hover:bg-black hover:text-white transition-all transform hover:-translate-y-2 tracking-[0.2em] md:tracking-[0.3em] text-sm md:text-lg flex items-center gap-3">RETURN TO HOME</a>
    </main>
  </body>
</html>
