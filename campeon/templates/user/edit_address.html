{% extends 'user/partials/base.html' %}
{% load static %}
{% block content %}
  <main class="flex-1 bg-lime-light p-12">
    <div class="flex justify-between items-center mb-12">
      <h2 class="text-6xl font-black uppercase tracking-tighter leading-none tracking-tightest">EDIT ADDRESS</h2>
      <a href="Address Book.html" class="text-[10px] font-black uppercase tracking-widest hover:underline transition-all">Back to Address Book</a>
    </div>

    <form class="max-w-4xl">
      <div class="bg-white p-12 rounded-sm shadow-sm space-y-12">
        <div class="grid grid-cols-2 gap-10">
          <div class="col-span-2">
            <label class="block text-[9px] font-black uppercase tracking-widest text-gray-400 mb-3">Street Address</label>
            <input type="text" value="Street 12, Pitch Editorial District" class="w-full bg-gray-50 border border-gray-100 rounded-lg px-6 py-4 text-xs font-black uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-lime/20" />
          </div>
          <div>
            <label class="block text-[9px] font-black uppercase tracking-widest text-gray-400 mb-3">City</label>
            <input type="text" value="Palakkad" class="w-full bg-gray-50 border border-gray-100 rounded-lg px-6 py-4 text-xs font-black uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-lime/20" />
          </div>
          <div>
            <label class="block text-[9px] font-black uppercase tracking-widest text-gray-400 mb-3">State / Province</label>
            <input type="text" value="Kerala" class="w-full bg-gray-50 border border-gray-100 rounded-lg px-6 py-4 text-xs font-black uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-lime/20" />
          </div>
          <div>
            <label class="block text-[9px] font-black uppercase tracking-widest text-gray-400 mb-3">Pincode</label>
            <input type="text" value="628015" class="w-full bg-gray-50 border border-gray-100 rounded-lg px-6 py-4 text-xs font-black uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-lime/20" />
          </div>
          <div>
            <label class="block text-[9px] font-black uppercase tracking-widest text-gray-400 mb-3">Country</label>
            <select class="w-full bg-gray-50 border border-gray-100 rounded-lg px-6 py-4 text-xs font-black uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-lime/20 appearance-none">
              <option>United States</option>
              <option selected>India</option>
              <option>United Kingdom</option>
            </select>
          </div>
        </div>

        <div class="flex items-center gap-4 pt-6">
          <button type="submit" class="bg-lime-dark text-white px-12 py-5 text-[10px] font-black uppercase tracking-[0.2em] rounded-sm shadow-xl hover:bg-black transition-all">Save Address</button>
          <button type="button" class="bg-white border border-gray-200 text-black px-12 py-5 text-[10px] font-black uppercase tracking-[0.2em] rounded-sm shadow-sm hover:bg-gray-50 transition-all">Cancel</button>
        </div>
      </div>
    </form>
  </main>
{% endblock %}
