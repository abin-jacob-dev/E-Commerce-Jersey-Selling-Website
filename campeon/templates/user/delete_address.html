{% extends 'user/partials/base.html' %}
{% load static %}

{% block content %}

<div class="w-full min-h-[calc(100vh-80px)] flex items-center justify-center bg-[#d9e6d1] px-4 py-10">

  <!-- Modal -->
  <div class="relative w-full max-w-md bg-white rounded-2xl shadow-[0_35px_60px_-15px_rgba(0,0,0,0.3)] overflow-hidden">

    <!-- Top Accent -->
    <div class="absolute top-0 left-0 w-full h-1 bg-[#c11d1d]"></div>

    <div class="p-10">

      <!-- Icon -->
      <div class="flex justify-center mb-6">
        <div class="w-16 h-16 bg-[#fde7e7] rounded-xl flex items-center justify-center">
          <svg class="w-8 h-8 text-[#c11d1d]" fill="currentColor" viewBox="0 0 24 24">
            <path d="M3 6h18v2H3V6zm2 3h14v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9zm3 3v8h2v-8H8zm4 0v8h2v-8h-2zm4 0v8h2v-8h-2zM9 4V2h6v2h5v2H4V4h5z"/>
          </svg>
        </div>
      </div>

      <!-- Title -->
      <h2 class="text-3xl md:text-4xl font-black uppercase text-center leading-tight tracking-tight mb-4">
        Delete This Address
      </h2>

      <!-- Description -->
      <p class="text-center text-sm font-semibold text-gray-700 uppercase tracking-wider leading-relaxed mb-8">
        Are you sure you want to delete this address?
        This action is
        <span class="text-[#c11d1d] font-black">permanent</span>
        and cannot be reversed.
      </p>

      <!-- Buttons -->
      <div class="space-y-4">

        <form method="POST">
          {% csrf_token %}

          <button
            type="submit"
            class="w-full bg-[#c11d1d] text-white py-4 rounded-lg font-black uppercase text-sm tracking-widest hover:bg-black transition-all duration-200">
            Delete Permanently
          </button>

        </form>

        <a href="{% url 'user:address' %}"
           class="w-full border border-[#006400] text-black py-4 rounded-lg font-black uppercase text-sm tracking-widest hover:bg-gray-50 transition-all duration-200 flex items-center justify-center">
          Go Back
        </a>

      </div>

    </div>
  </div>
</div>

{% endblock %}
