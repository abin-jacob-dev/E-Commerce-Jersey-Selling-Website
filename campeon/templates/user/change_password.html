{% extends 'user/partials/base.html' %}
{% load static %}
{% block content %}
  <main class="flex-1 bg-lime-light p-12">
    <div class="flex justify-between items-center mb-12">
      <h2 class="text-6xl font-black uppercase tracking-tighter leading-none tracking-tightest">SECURITY</h2>
      <a href="{% url "user:profile" %}" class="text-[10px] font-black uppercase tracking-widest hover:underline transition-all">Back to Profile</a>
    </div>

    <div class="max-w-xl">
      <div class="bg-white p-12 rounded-sm shadow-sm space-y-12">
        {% include 'partials/alert.html' %}
        <div>
          <h3 class="text-2xl font-black uppercase tracking-tighter mb-2 tracking-tightest">Change Password</h3>
          <p class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">Update your security credentials regularly to stay protected.</p>
        </div>

        <form class="space-y-8" method="POST">
          {% csrf_token %}
          <div>
            <label class="block text-[9px] font-black uppercase tracking-widest text-gray-400 mb-3">Current Password</label>
            <input name="current_password" type="password" placeholder="••••••••" class="w-full bg-gray-50 border border-gray-100 rounded-lg px-6 py-4 text-xs font-black uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-lime/20" />
          </div>
          <div>
            <label class="block text-[9px] font-black uppercase tracking-widest text-gray-400 mb-3">New Password</label>
            <input name="new_password" type="password" placeholder="••••••••" class="w-full bg-gray-50 border border-gray-100 rounded-lg px-6 py-4 text-xs font-black uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-lime/20" />
          </div>
          <div>
            <label class="block text-[9px] font-black uppercase tracking-widest text-gray-400 mb-3">Confirm New Password</label>
            <input name="confirm_password" type="password" placeholder="••••••••" class="w-full bg-gray-50 border border-gray-100 rounded-lg px-6 py-4 text-xs font-black uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-lime/20" />
          </div>

          <div class="pt-6">
            <button type="submit" class="w-full bg-lime-dark text-white px-12 py-5 text-[10px] font-black uppercase tracking-[0.2em] rounded-sm shadow-xl hover:bg-black transition-all">Update Password</button>
          </div>
        </form>
      </div>
    </div>
  </main>
{% endblock %}
