{% extends 'user/partials/base.html' %}
{% load static %}
{% block content %}
<main class="flex-1 bg-lime-light p-12">
  <div class="flex justify-between items-center mb-12">
    <h2 class="text-6xl font-black uppercase tracking-tighter leading-none tracking-tightest">EDIT PROFILE</h2>
    <a href="{% url 'user:profile' %}" class="text-[13px] font-black uppercase tracking-widest hover:underline transition-all">Back to Profile</a>
  </div>
  
  <form action="{% url 'user:edit_profile' %}" method="POST"  class="max-w-4xl space-y-12">
    {% csrf_token %}
    <!-- Form Fields -->
    {% include "partials/alert.html" %}
  <!-- Avatar Upload -->
                <div class="flex items-center gap-10">
                    <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-white shadow-xl relative group">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=200&h=200&auto=format&fit=crop" class="w-full h-full object-cover grayscale opacity-50 group-hover:grayscale-0 group-hover:opacity-100 transition-all">
                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                            <span class="text-white text-[12px] font-black uppercase tracking-widest">Change Photo</span>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-sm font-black uppercase tracking-widest mb-2 tracking-tightest">Alex Morgan</h4>
                        <p class="text-[12px] font-bold text-gray-300 uppercase tracking-widest leading-loose">Square format recommended.<br>JPG or PNG, max 2MB.</p>
                    </div>
                </div>
    <div class="bg-white p-12 rounded-sm shadow-sm">
    <div class="grid grid-cols-2 gap-10">
      
      <div class="col-span-2 md:col-span-1">
        <label class="block text-[12px] font-black uppercase tracking-widest text-black-400 mb-3">Full Name</label>
        <input name="full_name" type="text" value="{{ user.full_name }}" class="w-full bg-gray-50 border border-gray-100 rounded-lg px-6 py-4 text-xs font-black uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-lime/20" />
      </div>

      <div class="col-span-2 md:col-span-1 relative">
        <label class="block text-[12px] font-black uppercase tracking-widest text-black-400 mb-3">Email Address</label>
        <input name="email" type="email" value="{{ user.email }}" class="w-full bg-gray-50 border border-gray-100 rounded-lg px-6 py-4 text-xs font-black uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-lime/20 pr-14" />
      </div>

      <div class="col-span-2 md:col-span-1">
        <label class="block text-[12px] font-black uppercase tracking-widest text-black-400 mb-3">Phone Number</label>
        <input name="phone_number" type="number" value="{{ user.phone_number }}" class="w-full bg-gray-50 border border-gray-100 rounded-lg px-6 py-4 text-xs font-black uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-lime/20" />
      </div>
    </div>

    <!-- OTP Section -->
    <div class="mt-5">
      <label for="otp" class="block text-xs font-semibold text-gray-300">Enter OTP</label>
      <div class="relative">
        <input id="otp" type="text" name="otp" placeholder="Enter OTP" class="w-full bg-gray-50 border border-gray-100 rounded-lg px-6 py-4 text-xs font-black uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-lime/20" />
        <button type="submit" name="send_otp" class="absolute right-4 top-[80%] transform -translate-y-1/2 text-white text-xs font-bold bg-lime-500 px-3 py-2 rounded-md" 
        {% if otp and not otp.is_expired %}
          disabled
        {% endif %}
        >Send OTP</button>
      </div>
    </div>

    <div class="flex items-center gap-4 pt-12 border-t border-gray-50 mt-12">
      <button type="submit" class="bg-lime-dark text-white px-12 py-5 text-[13px] font-black uppercase tracking-[0.2em] rounded-sm shadow-xl hover:bg-black transition-all">Save Changes</button>
      <button type="button" class="bg-white border border-gray-200 text-black px-12 py-5 text-[13px] font-black uppercase tracking-[0.2em] rounded-sm shadow-sm hover:bg-gray-50 transition-all">Cancel</button>
    </div>
  </div>
</form>
  </main>
{% endblock %}
