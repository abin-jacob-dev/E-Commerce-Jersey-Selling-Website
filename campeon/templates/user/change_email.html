{% extends 'user/partials/base.html' %}
{% load static %}
{% block content %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  const expiryTimestamp = "{{ otp_expiry|default:'' }}";

  if (expiryTimestamp && !isNaN(expiryTimestamp)) {
    const sendBtn = document.querySelector("button[name='send_otp']");
    if (!sendBtn) return;

    const timerDisplay = document.createElement("p");
    timerDisplay.className = "text-[13px] text-red-500 mt-2 uppercase tracking-widest";
    sendBtn.parentElement.parentElement.appendChild(timerDisplay);

    function updateTimer() {
      const now = new Date().getTime();
      const expiryTime = parseFloat(expiryTimestamp) * 1000;
      const remaining = expiryTime - now;

      if (remaining <= 0) {
        timerDisplay.innerText = "You can request a new OTP now.";
        sendBtn.disabled = false;
        sendBtn.classList.remove("opacity-50", "cursor-not-allowed");
        return;
      }

      const minutes = Math.floor(remaining / 1000 / 60);
      const seconds = Math.floor((remaining / 1000) % 60);

      timerDisplay.innerText = `Resend OTP in ${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;

      sendBtn.disabled = true;
      sendBtn.classList.add("opacity-50", "cursor-not-allowed");

      setTimeout(updateTimer, 1000);
    }

    updateTimer();
  }
});
</script>
  <div class="min-h-screen w-full bg-lime-light px-10 py-12">
    <div class="w-full max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-12 space-y-10">
      <p> Current mail : {{user.email}}</p>
      <form action="" method="post">
        {% csrf_token %}
        <div>
          {% include 'user/partials/alert.html' %}
          <label class="block text-[12px] font-black uppercase tracking-widest text-black-400 mb-3">New Email Address</label>

          <div class="flex items-stretch bg-gray-50 border border-gray-100 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-lime-200">
            <input name="email" value="{{ request.session.pending_email|default:'' }}" type="email" placeholder="Enter new email address" class="flex-1 px-6 py-4 text-xs font-black  tracking-widest bg-transparent focus:outline-none" {% if request.session.pending_email %}readonly{% endif %} />

            <button type="submit" name="send_otp" class="px-6 text-[13px] font-black uppercase bg-lime-500 text-white hover:bg-lime-600 transition-all flex items-center justify-center">Send OTP</button>
          </div>

          <p class="text-[13px] text-black-400 mt-2 uppercase tracking-widest">OTP will be sent to this email</p>
        </div>
      </form>
      <form action="" method="post">
        {% csrf_token %}
        <div>
          <label class="block text-[12px] font-black uppercase tracking-widest text-black-400 mb-3">Enter OTP</label>

          <div class="flex items-stretch bg-gray-50 border border-gray-100 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-lime-200">
            <input name="otp" type="text" placeholder="Enter OTP" maxlength="6" class="flex-1 px-6 py-4 text-xs font-black tracking-widest bg-transparent focus:outline-none" />

            <button type="submit" name="verify_otp" class="px-6 text-[13px] font-black uppercase bg-black text-white hover:bg-gray-800 transition-all flex items-center justify-center">Verify</button>
          </div>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
