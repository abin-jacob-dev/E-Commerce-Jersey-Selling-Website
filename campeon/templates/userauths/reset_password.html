{% extends 'partials/base.html' %}
{% load static %}
{% block content %}
  <main class="flex-1 flex items-center justify-center py-20 px-4">
    <div class="bg-white rounded-3xl p-12 w-full max-w-lg shadow-sm border border-white">
      <div class="text-center mb-10">
        <h2 class="text-4xl font-black mb-2 tracking-tightest">Reset Password</h2>
        <p class="text-xs text-black-400 font-bold uppercase tracking-widest">Enter your credentials.</p>
      </div>
      {% include 'partials/alert.html' %}
      <form class="space-y-6" method="POST" action="{% url 'userauths:reset_password' %}">
        {% csrf_token %}
        <div>
          <label class="block text-[13px] font-black uppercase tracking-widest mb-2 text-gray-500">Create Password</label>
          <div class="input-field rounded-lg flex items-center px-4 py-3">
            <svg class="w-5 h-5 text-black-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
            <input type="password" placeholder="••••••••" class="bg-transparent w-full focus:outline-none text-sm font-medium tracking-widest focus:ring-2 focus:ring-lime/20" name="password" />
          </div>
        </div>

        <div>
          <label class="block text-[13px] font-black uppercase tracking-widest mb-2 text-gray-500">Confirm Password</label>
          <div class="input-field rounded-lg flex items-center px-4 py-3">
            <svg class="w-5 h-5 text-black-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
            <input type="password" placeholder="••••••••" class="bg-transparent w-full focus:outline-none text-sm font-medium tracking-widest focus:ring-2 focus:ring-lime/20" name="confirm_password" />
          </div>
        </div>
        <button class="w-full bg-lime-bright text-black font-black uppercase py-5 rounded-lg shadow-lg hover:bg-black hover:text-white transition-all transform hover:-translate-y-1 tracking-[0.2em] text-sm">Set as Password</button>
      </form>

      <div class="text-center mt-10">
        <p class="text-[13px] font-black uppercase tracking-widest text-black-400">
          Don't have an account? <a href="{% url 'userauths:signin' %}" class="text-[#00a300] hover:underline">Signin</a>
        </p>
      </div>

      <div class="mt-12">
        <div class="relative flex items-center justify-center mb-8">
          <div class="border-t border-gray-100 w-full"></div>
          <span class="absolute bg-white px-4 text-[12px] font-black uppercase tracking-[0.3em] text-gray-300">Or continue with</span>
        </div>

        <button class="w-full border border-gray-100 py-4 rounded-lg flex items-center justify-center gap-3 hover:bg-gray-50 transition-colors">
          <img src="https://www.google.com/favicon.ico" alt="Google" class="w-4 h-4 grayscale opacity-50" />
          <span class="text-[13px] font-black uppercase tracking-widest">Google</span>
        </button>
      </div>
    </div>
  </main>
{% endblock %}
