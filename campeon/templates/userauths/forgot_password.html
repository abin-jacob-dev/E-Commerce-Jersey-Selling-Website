{% extends 'partials/base.html' %}
{% load static %}
{% block title %}Campeon{% endblock title %}
{% block content %}
  <main class="flex-1 flex items-center justify-center py-20 px-4">
    <div class="bg-white rounded-[3rem] p-12 md:p-20 w-full max-w-xl shadow-sm border border-white">
      {% include "partials/alert.html" %}
      <div class="text-left mb-12">
        <h2 class="text-3xl md:text-4xl font-black mb-4 tracking-tightest">Reset Password</h2>
        <p class="text-xs font-bold text-black-400 uppercase tracking-widest leading-relaxed">Enter your email to receive a password reset link.</p>
      </div>

      <form class="space-y-10" method="POST">
        {% csrf_token %}
        <div>
          <label class="block text-[13px] font-black uppercase tracking-widest mb-3 text-gray-500">Email Address</label>
          <div class="input-field rounded-lg flex items-center px-6 py-5">
            <input type="email" name='email' placeholder="name@stadium.com" class="bg-transparent w-full focus:outline-none text-sm font-medium focus:ring-2 focus:ring-lime/20" />
            <span class="text-black-400 font-bold ml-2">@</span>
          </div>
        </div>

        <button type="submit" class="w-full bg-lime-bright text-black font-black uppercase py-5 rounded-lg shadow-xl hover:bg-black hover:text-white transition-all transform hover:-translate-y-1 tracking-[0.2em] text-sm flex items-center justify-center gap-3">
          Send Reset Link<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        </button>
      </form>

      <div class="mt-12 text-center">
        <a href="{% url "userauths:signin" %}" class="text-[13px] font-black uppercase tracking-widest text-black-400 hover:text-black flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>Back to Login
        </a>
      </div>
    </div>
  </main>
{% endblock %}
