{% extends 'partials/base.html' %}
{% load static %}
{% block content %}
  <div class="min-h-screen w-full bg-lime-light px-10 py-12">
    <div class="w-full max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-12 space-y-10">
      <div class="text-left mb-12">
        <h2 class="text-3xl md:text-4xl font-black mb-4 tracking-tightest">Account Activation</h2>
        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest leading-relaxed"></p>
      </div>
      <form action="" method="post">
        {% csrf_token %}
        <div>
          {% include 'user/partials/alert.html' %}
          <label class="block text-[9px] font-black uppercase tracking-widest text-gray-400 mb-3">Email Address</label>

          <div class="flex items-stretch bg-gray-50 border border-gray-100 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-lime-200">
            <input name="email" value="{{ request.session.verified_email|default:'' }}" type="email" placeholder="Enter new email address" class="flex-1 px-6 py-4 text-xs font-black  tracking-widest bg-transparent focus:outline-none" {% if request.session.activate_account %}readonly{% endif %} />

            <button type="submit" name="send_otp" class="px-6 text-[10px] font-black uppercase bg-lime-500 text-white hover:bg-lime-600 transition-all flex items-center justify-center">Send OTP</button>
          </div>

          <p class="text-[10px] text-gray-400 mt-2 uppercase tracking-widest">OTP will be sent to this email</p>
        </div>
      </form>
      <form action="" method="post">
        {% csrf_token %}
        <div>
          <label class="block text-[9px] font-black uppercase tracking-widest text-gray-400 mb-3">Enter OTP</label>

          <div class="flex items-stretch bg-gray-50 border border-gray-100 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-lime-200">
            <input name="otp" type="text" placeholder="Enter OTP" maxlength="6" class="flex-1 px-6 py-4 text-xs font-black tracking-widest bg-transparent focus:outline-none" />

            <button type="submit" name="verify_otp" class="px-6 text-[10px] font-black uppercase bg-black text-white hover:bg-gray-800 transition-all flex items-center justify-center">Verify</button>
          </div>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
