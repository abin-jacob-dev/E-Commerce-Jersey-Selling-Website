{% extends 'admin/partials/base.html' %}
{% load static %}

{% block content %}
<body class="bg-lime-light min-h-screen flex font-montserrat antialiased">

<main class="flex-1 p-12 overflow-y-auto">

<form method="POST">
  {% csrf_token %}

  <div class="flex items-start justify-between mb-12">
    <h2 class="text-5xl font-black uppercase tracking-tighter leading-none">
      EDIT OFFER
    </h2>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">

    <!-- LEFT -->
    <div class="lg:col-span-8 space-y-8">

      <div class="bg-white p-8 rounded-lg shadow-sm">

        <!-- NAME + ACTIVE -->
        <div class="flex items-center justify-between mb-6">
          <label class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500">
            OFFER NAME
          </label>

          <div class="flex items-center gap-3">
            <span class="text-sm font-bold">Active</span>
            <input type="checkbox" name="is_active"
                   {% if offer.is_active %}checked{% endif %}>
          </div>
        </div>

        <input type="text"
               name="name"
               value="{{ offer.name }}"
               class="w-full h-14 bg-[#eef6df] px-4 text-base font-bold text-gray-700 rounded mb-8">

        <!-- TARGET TYPE -->
        <div class="mb-6">
          <label class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500 mb-2 block">
            TARGET TYPE
          </label>

          <select name="target_type" id="targetType"
                  class="w-full h-14 bg-[#eef6df] px-4 text-base font-bold text-gray-700 rounded">

            <option value="">Select</option>

            <option value="product"
              {% if offer.product %}selected{% endif %}>
              Product
            </option>

            <option value="category"
              {% if offer.category %}selected{% endif %}>
              Category
            </option>

          </select>
        </div>

        <!-- PRODUCT -->
        <div id="productBox" class="{% if not offer.product %}hidden{% endif %} mt-6">
          <label class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500 mb-3 block">
            SELECT PRODUCT
          </label>

          <select name="product_id"
                  class="w-full h-14 bg-[#eef6df] px-4 text-base font-bold text-gray-700 rounded">

            <option value="">Choose Product</option>

            {% for product in products %}
              <option value="{{ product.id }}"
                {% if offer.product and offer.product.id == product.id %}selected{% endif %}>
                {{ product.name }}
              </option>
            {% endfor %}

          </select>
        </div>

        <!-- CATEGORY -->
        <div id="categoryBox" class="{% if not offer.category %}hidden{% endif %} mt-6">
          <label class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500 mb-3 block">
            SELECT CATEGORY
          </label>

          <select name="category_id"
                  class="w-full h-14 bg-[#eef6df] px-4 text-base font-bold text-gray-700 rounded">

            <option value="">Choose Category</option>

            {% for category in categories %}
              <option value="{{ category.id }}"
                {% if offer.category and offer.category.id == category.id %}selected{% endif %}>
                {{ category.name }}
              </option>
            {% endfor %}

          </select>
        </div>

        <!-- DISCOUNT -->
        <div class="grid grid-cols-2 gap-6 mt-8">

          <div>
            <label class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500 mb-2 block">
              DISCOUNT TYPE
            </label>

            <select name="discount_type"
                    class="w-full h-14 bg-[#eef6df] px-4 text-base font-bold text-gray-700 rounded">

              <option value="percentage"
                {% if offer.discount_type == "percentage" %}selected{% endif %}>
                Percentage (%)
              </option>

              <option value="fixed"
                {% if offer.discount_type == "fixed" %}selected{% endif %}>
                Fixed Amount (₹)
              </option>

            </select>
          </div>

          <div>
            <label class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500 mb-2 block">
              VALUE
            </label>

            <input type="number"
                   name="discount_value"
                   value="{{ offer.discount_value }}"
                   class="w-full h-14 bg-[#eef6df] px-4 text-base font-bold text-gray-700 rounded">
          </div>

        </div>

      </div>
    </div>

    <!-- RIGHT -->
    <div class="lg:col-span-4 space-y-8">

      <div class="bg-[#e2ead8] p-6 rounded-lg">

        <div class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-600 mb-6">
          SCHEDULE
        </div>

        <div class="space-y-4">

          <div>
            <label class="text-[10px] font-bold text-gray-500 mb-2 block">Start Date</label>
            <input type="datetime-local"
                   name="start_date"
                   value="{{ offer.start_date|date:'Y-m-d\\TH:i' }}"
                   class="w-full h-12 bg-white px-4 text-sm font-bold rounded">
          </div>

          <div>
            <label class="text-[10px] font-bold text-gray-500 mb-2 block">End Date</label>
            <input type="datetime-local"
                   name="end_date"
                   value="{{ offer.end_date|date:'Y-m-d\\TH:i' }}"
                   class="w-full h-12 bg-white px-4 text-sm font-bold rounded">
          </div>

        </div>
      </div>

      <div class="space-y-4">

        <button type="submit"
                class="w-full h-14 bg-green-900 text-white text-sm font-black uppercase tracking-[0.15em] rounded-lg">
          UPDATE OFFER
        </button>

        <a href="{% url 'products:offers' %}"
           class="w-full h-12 bg-[#e2ead8] text-gray-700 text-sm font-black rounded-lg flex items-center justify-center">
          Cancel
        </a>

      </div>

    </div>

  </div>

</form>

</main>

<script>
const targetType = document.getElementById("targetType");
const productBox = document.getElementById("productBox");
const categoryBox = document.getElementById("categoryBox");

function toggleTargets() {
  if (targetType.value === "product") {
    productBox.classList.remove("hidden");
    categoryBox.classList.add("hidden");
  } else if (targetType.value === "category") {
    categoryBox.classList.remove("hidden");
    productBox.classList.add("hidden");
  } else {
    productBox.classList.add("hidden");
    categoryBox.classList.add("hidden");
  }
}

targetType.addEventListener("change", toggleTargets);
toggleTargets();
</script>

</body>
{% endblock %}
