{% extends 'admin/partials/base.html' %}
{% load static %}
{% block content %}
  <main class="flex-1 p-12 overflow-y-auto">
    <div class="flex justify-between items-start mb-12">
      <div>
        <h2 class="text-6xl font-black uppercase tracking-tighter leading-none mb-4 tracking-tightest">Dashboard</h2>
        <p class="text-xs font-bold text-black-400 uppercase tracking-widest">Performance metrics for the current season</p>
      </div>
      <div class="flex items-center gap-4">
        <div class="bg-white px-6 py-3 rounded-lg shadow-sm border border-gray-100 flex items-center gap-3">
          <svg class="w-4 h-4 text-black-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <span class="text-[13px] font-black uppercase tracking-widest">Oct 12 - Oct 19, 2024</span>
        </div>
        <button class="bg-[#006400] text-white px-8 py-3 text-[13px] font-black uppercase tracking-widest rounded-lg shadow-lg hover:bg-black transition-all">Export Report</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mb-12">
      <!-- Stats Card 1 -->
      <div class="bg-white p-10 rounded-[2rem] shadow-sm flex flex-col justify-between h-64 relative overflow-hidden group">
        <div class="w-12 h-12 bg-lime-bright rounded-xl flex items-center justify-center text-black mb-6">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <div>
          <span class="text-[13px] font-black uppercase tracking-widest text-black-400 block mb-2">Total Sales</span>
          <div class="text-5xl font-black text-black tracking-tighter">₹84,230</div>
        </div>
        <div class="absolute top-0 right-0 w-32 h-32 bg-lime-bright/5 rounded-full -mr-16 -mt-16 group-hover:scale-150 transition-transform duration-700"></div>
      </div>

      <!-- Stats Card 2 -->
      <div class="bg-white p-10 rounded-[2rem] shadow-sm flex flex-col justify-between h-64 relative overflow-hidden group">
        <div class="w-12 h-12 bg-[#eff6e9] rounded-xl flex items-center justify-center text-lime-dark mb-6">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>
        <div>
          <span class="text-[13px] font-black uppercase tracking-widest text-black-400 block mb-2">Total Users</span>
          <div class="text-5xl font-black text-black tracking-tighter">12,842</div>
        </div>
      </div>

      <!-- Stats Card 3 -->
      <div class="bg-white p-10 rounded-[2rem] shadow-sm flex flex-col justify-between h-64 relative overflow-hidden group">
        <div class="w-12 h-12 bg-[#fcd3d1]/30 rounded-xl flex items-center justify-center text-red-500 mb-6">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>
        </div>
        <div>
          <span class="text-[13px] font-black uppercase tracking-widest text-black-400 block mb-2">Total Orders</span>
          <div class="text-5xl font-black text-black tracking-tighter">154</div>
        </div>
      </div>

      <!-- Stats Card 4 -->
      <div class="bg-white p-10 rounded-[2rem] shadow-sm flex flex-col justify-between h-64 relative overflow-hidden group">
        <div class="w-12 h-12 bg-lime-bright rounded-xl flex items-center justify-center text-black mb-6">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
          </svg>
        </div>
        <div>
          <span class="text-[13px] font-black uppercase tracking-widest text-black-400 block mb-2">Delivered Orders</span>
          <div class="text-5xl font-black text-black tracking-tighter">135</div>
        </div>
      </div>
    </div>
  </main>
{% endblock %}
