{% extends 'admin/partials/base.html' %}
{% load static %}

{% block content %}
  <main class="flex-1 p-12 overflow-y-auto">
    <div class="flex justify-between items-center mb-12">
      <div class="flex items-center gap-4">
        <a href="{% url 'products:colors' %}" class="p-2 bg-white rounded-lg shadow-sm hover:bg-black-50 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
        </a>
        <h2 class="text-4xl font-black uppercase tracking-tighter leading-none tracking-tightest">ADD NEW COLOR</h2>
      </div>
    </div>

    <form class="max-w-4xl" method="POST">
      {% csrf_token %}
      <div class="bg-white p-12 rounded-[2rem] border border-black-100 shadow-sm space-y-12">
        <div class="grid grid-cols-2 gap-10">
          <div class="col-span-2 md:col-span-1">
            <label class="block text-[12px] font-black uppercase tracking-widest text-black-400 mb-3">Color Name</label>
            <input type="text" name="name" value="{{ form.name.value|default:'' }}" placeholder="e.g. Classic Black" class="w-full bg-black-50 border border-black-100 rounded-lg px-6 py-4 text-xs font-black uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-lime/20" />
            {% if form.name.errors %}
              <p class="text-red-500 text-[10px] mt-1">{{ form.name.errors.0 }}</p>
            {% endif %}
          </div>
          <div class="col-span-2 md:col-span-1">
            <label class="block text-[12px] font-black uppercase tracking-widest text-black-400 mb-3">Hex Code</label>
            <div class="flex gap-4">
              <input type="text" name="code" id="colorCode" value="{{ form.code.value|default:'#000000' }}" placeholder="#000000" class="w-full bg-black-50 border border-black-100 rounded-lg px-6 py-4 text-xs font-black uppercase tracking-widest focus:outline-none focus:ring-2 focus:ring-lime/20" />
              <input type="color" id="colorPicker" value="{{ form.code.value|default:'#000000' }}" class="h-14 w-20 bg-black-50 border border-black-100 rounded-lg p-1 cursor-pointer" />
            </div>
            {% if form.code.errors %}
              <p class="text-red-500 text-[10px] mt-1">{{ form.code.errors.0 }}</p>
            {% endif %}
          </div>
        </div>

        <div class="flex items-center gap-4 pt-6">
          <button type="submit" class="bg-[#006400] text-white px-12 py-5 text-[10px] font-black uppercase tracking-[0.2em] rounded-2xl shadow-xl hover:bg-black transition-all">Create Color</button>
          <a href="{% url 'products:colors' %}" class="bg-white border border-black-200 text-black px-12 py-5 text-[10px] font-black uppercase tracking-[0.2em] rounded-2xl shadow-sm hover:bg-black-50 transition-all">Cancel</a>
        </div>
      </div>
    </form>
  </main>

  <script>
    const colorPicker = document.getElementById('colorPicker');
    const colorCode = document.getElementById('colorCode');

    colorPicker.addEventListener('input', (e) => {
      colorCode.value = e.target.value.toUpperCase();
    });

    colorCode.addEventListener('input', (e) => {
      if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
        colorPicker.value = e.target.value;
      }
    });
  </script>
{% endblock %}
