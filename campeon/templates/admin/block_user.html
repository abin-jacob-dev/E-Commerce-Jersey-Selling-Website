{% extends 'admin/partials/base.html' %}
{% load static %}
{% block content %}
<div class="min-h-screen w-full flex items-center justify-center font-['Montserrat'] font-montserrat antialiased">
   <div class="bg-white rounded-[2rem] p-12 max-w-md w-full shadow-2xl relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-2 bg-yellow-600"></div>

      <div class="flex justify-center mb-8">
        <div class="w-16 h-16 bg-yellow-50 rounded-2xl flex items-center justify-center text-yellow-600">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        </div>
      </div>

      <h2 class="text-2xl font-black uppercase text-center mb-4 tracking-tighter leading-tight tracking-tightest">{% if user.is_blocked %}UNBLOCK USER {% else %}BLOCK USER{% endif %} </h2>

      <p class="text-center text-[13px] font-bold text-black-400 uppercase tracking-widest leading-relaxed mb-8">This action is reversible.</p>
      <form action="" method="post">
        {% csrf_token %}
        <div class="flex gap-4">
          <a href="{% url 'admin_panel:users' %}" class="flex-1 bg-gray-100 text-black py-4 rounded-xl font-black uppercase text-[13px] tracking-widest hover:bg-gray-200 transition-all text-center">Cancel</a>
          <button type="submit" name='block_user_confimed' class="flex-1 bg-black text-white py-4 rounded-xl font-black uppercase text-[13px] tracking-widest hover:bg-red-600 transition-all">Confirm</button>  
        </div>
      </form>
    </div>
  </div>
{% endblock %}
