{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management - Admin Panel</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet" />
    <!-- Cropper -->
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Tailwind -->
    <script src="{% static 'vendor/tailwind.min.js' %}"></script>
    <script src="{% static 'js/tailwind-config.js' %}"></script>
    <script src="{% static 'js/script.js' %}"></script>
  </head>
  {% include 'components/alert.html' %}
  <body class="bg-lime-light min-h-screen flex font-montserrat antialiased">
    <!-- Admin Sidebar -->
    <aside class="w-64 bg-[#fff] min-h-screen p-8 flex flex-col border-r border-gray-200">
      <div class="mb-12 text-center md:text-left">
        <h1 class="text-xl font-bold uppercase tracking-tighter tracking-tightest">Campeon</h1>
        <p class="text-[12px] font-bold uppercase tracking-widest text-black-400">Admin Panel</p>
      </div>

      <nav class="space-y-8 flex-1">
        <a href="{% url 'admin_panel:dashboard' %}" class="flex items-center gap-4 text-xs font-bold uppercase tracking-widest text-black-400 hover:text-black">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
          </svg>Dashboard
        </a>
        <a href="{% url 'products:products_list' %}" class="flex items-center gap-4 text-xs font-bold uppercase tracking-widest text-black-400 hover:text-black">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>Products
        </a>
        <a href="{% url 'products:categories' %}" class="flex items-center gap-4 text-xs font-bold uppercase tracking-widest text-black-400 hover:text-black">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
          </svg>Categories
        </a>

        <a href="{% url 'products:all_orders' %}" class="flex items-center gap-4 text-xs font-bold uppercase tracking-widest text-black-400 hover:text-black">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
          </svg>Orders
        </a>
        <a href="{% url 'admin_panel:users' %}" class="flex items-center gap-4 text-xs font-bold uppercase tracking-widest text-black-400 hover:text-black">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>Users
        </a>
        <a href="{% url 'admin_panel:sales' %}" class="flex items-center gap-4 text-xs font-bold uppercase tracking-widest text-black-400 hover:text-black">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
          </svg>Sales
        </a>
        <a href="{% url 'products:coupons' %}" class="flex items-center gap-4 text-xs font-bold uppercase tracking-widest text-black-400 hover:text-black">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path>
          </svg>Coupons
        </a>
        <a href="{% url 'products:offers' %}" class="flex items-center gap-4 text-xs font-bold uppercase tracking-widest text-black-400 hover:text-black">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M3 11l8.586 8.586a2 2 0 002.828 0l6.172-6.172a2 2 0 000-2.828L12 2H5a2 2 0 00-2 2v7z"></path>
          </svg>Offers
        </a>
        {% comment %} <a href="admin-reviews.html" class="flex items-center gap-4 text-xs font-bold uppercase tracking-widest text-black-400 hover:text-black">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
          </svg>Reviews
        </a> {% endcomment %}
        <a href="{% url 'userauths:signout_admin' %}" class="flex items-center gap-4 text-xs font-bold uppercase tracking-widest text-red-500 hover:text-red-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>Signout
        </a>
      </nav>

      <div class="pt-20">
        {% comment %}Signout{% endcomment %}
      </div>
    </aside>
    {% block content %}

    {% endblock %}
  </body>
</html>
